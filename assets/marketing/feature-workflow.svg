<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
<title id="title">Agents Squad Team feature workflow</title>
<desc id="desc">Business analyst, architect, project manager, developer, QA with a fail-and-retry loop, code review and conditional security audit, technical writer, then project manager closes tasks. Artifacts and handoffs are stored in .squad.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080D1B"/><stop offset="1" stop-color="#15152D"/></linearGradient>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#55DDF1" stroke-width="1.5"/></marker>
  <marker id="retry" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#B99CFF" stroke-width="1.5"/></marker>
</defs>
<rect width="1600" height="1160" rx="28" fill="url(#bg)"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="64" y="64" fill="#B99CFF" font-size="19" font-weight="bold" letter-spacing="3">AGENTS SQUAD TEAM / FEATURE WORKFLOW</text>
<text x="64" y="127" fill="#F5F7FF" font-size="47" font-weight="bold">From request to reviewed feature.</text>
<rect x="64" y="155" width="725" height="52" rx="12" fill="#171F35" stroke="#35425F"/>
<text x="86" y="189" fill="#86E6F4" font-family="DejaVu Sans Mono, monospace" font-size="24">/dev-squad:feature &lt;description&gt;</text>
<rect x="64" y="260" width="440" height="174" rx="18" fill="#111A2D" stroke="#35425F" stroke-width="1.5"/><rect x="64" y="282" width="4" height="55" rx="2" fill="#55DDF1"/><text x="88" y="297" fill="#55DDF1" font-size="18" font-weight="bold">01</text><text x="88" y="339" fill="#F5F7FF" font-size="31" font-weight="bold">Clarify requirements</text><text x="88" y="376" fill="#55DDF1" font-size="21" font-weight="normal">business-analyst</text><text x="88" y="409" fill="#ABB7D0" font-size="18" font-weight="normal">User stories + acceptance criteria</text><rect x="580" y="260" width="440" height="174" rx="18" fill="#111A2D" stroke="#35425F" stroke-width="1.5"/><rect x="580" y="282" width="4" height="55" rx="2" fill="#55DDF1"/><text x="604" y="297" fill="#55DDF1" font-size="18" font-weight="bold">02</text><text x="604" y="339" fill="#F5F7FF" font-size="31" font-weight="bold">Design the solution</text><text x="604" y="376" fill="#55DDF1" font-size="21" font-weight="normal">architect</text><text x="604" y="409" fill="#ABB7D0" font-size="18" font-weight="normal">Module / API / data design</text><rect x="1096" y="260" width="440" height="174" rx="18" fill="#111A2D" stroke="#35425F" stroke-width="1.5"/><rect x="1096" y="282" width="4" height="55" rx="2" fill="#55DDF1"/><text x="1120" y="297" fill="#55DDF1" font-size="18" font-weight="bold">03</text><text x="1120" y="339" fill="#F5F7FF" font-size="31" font-weight="bold">Plan the work</text><text x="1120" y="376" fill="#55DDF1" font-size="21" font-weight="normal">project-manager</text><text x="1120" y="409" fill="#ABB7D0" font-size="18" font-weight="normal">Tasks, owners, dependencies</text><rect x="1096" y="524" width="440" height="174" rx="18" fill="#111A2D" stroke="#35425F" stroke-width="1.5"/><rect x="1096" y="546" width="4" height="55" rx="2" fill="#55DDF1"/><text x="1120" y="561" fill="#55DDF1" font-size="18" font-weight="bold">04</text><text x="1120" y="603" fill="#F5F7FF" font-size="31" font-weight="bold">Implement</text><text x="1120" y="640" fill="#55DDF1" font-size="21" font-weight="normal">developer</text><text x="1120" y="673" fill="#ABB7D0" font-size="18" font-weight="normal">Code + verification evidence</text><rect x="580" y="524" width="440" height="174" rx="18" fill="#111A2D" stroke="#35425F" stroke-width="1.5"/><rect x="580" y="546" width="4" height="55" rx="2" fill="#55DDF1"/><text x="604" y="561" fill="#55DDF1" font-size="18" font-weight="bold">05</text><text x="604" y="603" fill="#F5F7FF" font-size="31" font-weight="bold">Verify acceptance</text><text x="604" y="640" fill="#55DDF1" font-size="21" font-weight="normal">qa-engineer</text><text x="604" y="673" fill="#ABB7D0" font-size="18" font-weight="normal">FAIL: fix and re-test until PASS</text><rect x="64" y="524" width="440" height="174" rx="18" fill="#111A2D" stroke="#35425F" stroke-width="1.5"/><rect x="64" y="546" width="4" height="55" rx="2" fill="#B99CFF"/><text x="88" y="561" fill="#B99CFF" font-size="18" font-weight="bold">06</text><text x="88" y="603" fill="#F5F7FF" font-size="31" font-weight="bold">Review the changes</text><text x="88" y="640" fill="#B99CFF" font-size="21" font-weight="normal">code-reviewer + security-auditor</text><text x="88" y="673" fill="#ABB7D0" font-size="18" font-weight="normal">Security audit when relevant</text><rect x="64" y="844" width="440" height="174" rx="18" fill="#111A2D" stroke="#35425F" stroke-width="1.5"/><rect x="64" y="866" width="4" height="55" rx="2" fill="#55DDF1"/><text x="88" y="881" fill="#55DDF1" font-size="18" font-weight="bold">07</text><text x="88" y="923" fill="#F5F7FF" font-size="31" font-weight="bold">Document the feature</text><text x="88" y="960" fill="#55DDF1" font-size="21" font-weight="normal">tech-writer</text><text x="88" y="993" fill="#ABB7D0" font-size="18" font-weight="normal">README / API docs / CHANGELOG</text><rect x="580" y="844" width="440" height="174" rx="18" fill="#111A2D" stroke="#35425F" stroke-width="1.5"/><rect x="580" y="866" width="4" height="55" rx="2" fill="#55DDF1"/><text x="604" y="881" fill="#55DDF1" font-size="18" font-weight="bold">08</text><text x="604" y="923" fill="#F5F7FF" font-size="31" font-weight="bold">Close the tasks</text><text x="604" y="960" fill="#55DDF1" font-size="21" font-weight="normal">project-manager</text><text x="604" y="993" fill="#ABB7D0" font-size="18" font-weight="normal">Results, evidence, remaining risks</text><path d="M504 347 H572" fill="none" stroke="#55DDF1" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1020 347 H1088" fill="none" stroke="#55DDF1" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1316 434 V516" fill="none" stroke="#55DDF1" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1096 611 H1028" fill="none" stroke="#55DDF1" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M580 611 H512" fill="none" stroke="#55DDF1" stroke-width="2.5" marker-end="url(#arrow)"/><text x="518" y="593" fill="#55DDF1" font-size="14" font-weight="normal">PASS</text><path d="M800 698 V755 H1316 V706" fill="none" stroke="#B99CFF" stroke-width="2.5" marker-end="url(#retry)"/><text x="914" y="744" fill="#B99CFF" font-size="19" font-weight="normal">FAIL / fix + re-test</text><path d="M284 698 V836" fill="none" stroke="#55DDF1" stroke-width="2.5" marker-end="url(#arrow)"/><text x="302" y="782" fill="#ABB7D0" font-size="17" font-weight="normal">Resolve blocking findings</text><path d="M504 931 H572" fill="none" stroke="#55DDF1" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1096" y="844" width="440" height="174" rx="18" fill="#141C32" stroke="#765DB6" stroke-dasharray="5 6"/><text x="1120" y="887" fill="#B99CFF" font-size="29" font-weight="bold">.squad/</text><text x="1120" y="927" fill="#F5F7FF" font-size="23" font-weight="normal">Shared artifacts + handoffs</text><text x="1120" y="966" fill="#ABB7D0" font-size="19" font-weight="normal">Context for each next agent</text><path d="M64 1060 H1536" stroke="#35425F"/><text x="64" y="1101" fill="#ABB7D0" font-size="18" font-weight="normal">Design may be skipped for small changes. DB changes also involve database-engineer.</text><text x="64" y="1131" fill="#ABB7D0" font-size="18" font-weight="normal">Push / PR requires review and user confirmation. No automatic production deployment.</text></g></svg>